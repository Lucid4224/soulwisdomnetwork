# Spec 005 step 7: generate b-roll stills for one episode from its approved show notes
# (agent/src/podcast/broll.ts, docs/specs/008-broll-images.md). Started from the show notes
# page in the Podcast Studio, or by hand from the Actions tab with the episode ID.

name: Podcast B-roll
# The episode ID in the run name ties each run to its episode on the Usage page (lib/server/usage.ts).
run-name: "Podcast B-roll · ${{ inputs.episode_id }}"

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode ID (the Drive file ID in the Podcast Studio URL)'
        required: true
      index:
        description: 'Regenerate only this image (0 = the first idea); leave empty for all missing or changed'
        required: false
        default: ''

# One run per episode at a time; a second request for the same episode waits.
concurrency:
  group: podcast-broll-${{ inputs.episode_id }}
  cancel-in-progress: false

jobs:
  broll:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Generate B-roll
      env:
        EPISODE_ID: ${{ inputs.episode_id }}
        BROLL_INDEX: ${{ inputs.index }}
        PODCAST_SA_JSON: ${{ secrets.PODCAST_SA_JSON }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: npx tsx agent/src/podcast/broll.ts
