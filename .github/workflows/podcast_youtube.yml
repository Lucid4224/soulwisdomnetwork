# Spec 005 step 13: upload the approved episode to YouTube (agent/src/podcast/youtube.ts,
# docs/specs/012-youtube-upload.md). Started from the show notes page after Checkpoint D, or by
# hand from the Actions tab with the episode ID. A second run updates the same video.

name: Podcast YouTube Upload
# The episode ID in the run name ties each run to its episode on the Usage page (lib/server/usage.ts).
run-name: "Podcast YouTube Upload · ${{ inputs.episode_id }}"

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode ID (the Drive file ID in the Podcast Studio URL)'
        required: true

# One run per episode at a time; a second request for the same episode waits.
concurrency:
  group: podcast-youtube-${{ inputs.episode_id }}
  cancel-in-progress: false

# The jobs use their own keys; the GitHub token only needs to read this repository.
permissions:
  contents: read

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Upload to YouTube
      env:
        EPISODE_ID: ${{ inputs.episode_id }}
        PODCAST_SA_JSON: ${{ secrets.PODCAST_SA_JSON }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        YOUTUBE_PLAYLIST_ID: ${{ vars.YOUTUBE_PLAYLIST_ID }}
        GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: npx tsx agent/src/podcast/youtube.ts
