# Drafts show notes for one episode with several models or effort levels and emails a
# side-by-side comparison (agent/src/podcast/compareNotes.ts). Nothing on the episode
# changes. Run by hand from the Actions tab.

name: Podcast Show Notes Comparison

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode ID (the Drive file ID in the Podcast Studio URL)'
        required: true
      runs:
        description: 'Comma-separated model:effort pairs'
        required: true
        default: 'claude-opus-5:high,claude-opus-5-5:medium,claude-opus-5-5:high'

# The jobs use their own keys; the GitHub token only needs to read this repository.
permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Compare Show Notes
      env:
        EPISODE_ID: ${{ inputs.episode_id }}
        NOTES_RUNS: ${{ inputs.runs }}
        PODCAST_SA_JSON: ${{ secrets.PODCAST_SA_JSON }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      run: npx tsx agent/src/podcast/compareNotes.ts
