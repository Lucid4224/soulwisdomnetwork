# Spec 005 step 14: Shorts from the key quotes (agent/src/podcast/shorts.ts, docs/specs/013-shorts.md).
# mode "titles": Claude writes headlines and titles for the key quotes picked; "render": draws the shorts that changed;
# "upload": schedules the shorts approved at Checkpoint E on YouTube, one a day. Started from the
# show notes page, or by hand from the Actions tab with the episode ID.

name: Podcast Shorts
# The episode ID in the run name ties each run to its episode on the Usage page (lib/server/usage.ts).
run-name: "Podcast Shorts (${{ inputs.mode }}) · ${{ inputs.episode_id }}"

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode ID (the Drive file ID in the Podcast Studio URL)'
        required: true
      mode:
        description: 'titles, render or upload'
        required: true
        default: 'render'

# One run per episode at a time; a second request for the same episode waits.
concurrency:
  group: podcast-shorts-${{ inputs.episode_id }}
  cancel-in-progress: false

# The jobs use their own keys; the GitHub token only needs to read this repository.
permissions:
  contents: read

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install ffmpeg
      if: inputs.mode == 'render'
      run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

    - name: Make Shorts
      env:
        EPISODE_ID: ${{ inputs.episode_id }}
        SHORTS_MODE: ${{ inputs.mode }}
        PODCAST_SA_JSON: ${{ secrets.PODCAST_SA_JSON }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        YOUTUBE_PLAYLIST_ID: ${{ vars.YOUTUBE_PLAYLIST_ID }}
        GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: npx tsx agent/src/podcast/shorts.ts
