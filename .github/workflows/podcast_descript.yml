# Spec 005 step 8, part 2: make the Descript project for one episode from its edit package
# (agent/src/podcast/descript.ts, docs/specs/009-edit-package.md). Started from the show notes
# page, or by hand from the Actions tab with the episode ID. Each run makes a new project.

name: Podcast Descript
# The episode ID in the run name ties each run to its episode on the Usage page (lib/server/usage.ts).
run-name: "Podcast Descript · ${{ inputs.episode_id }}"

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode ID (the Drive file ID in the Podcast Studio URL)'
        required: true

# One run per episode at a time; a second request for the same episode waits.
concurrency:
  group: podcast-descript-${{ inputs.episode_id }}
  cancel-in-progress: false

jobs:
  descript:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Send to Descript
      env:
        EPISODE_ID: ${{ inputs.episode_id }}
        PODCAST_SA_JSON: ${{ secrets.PODCAST_SA_JSON }}
        DESCRIPT_API_TOKEN: ${{ secrets.DESCRIPT_API_TOKEN }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: npx tsx agent/src/podcast/descript.ts
