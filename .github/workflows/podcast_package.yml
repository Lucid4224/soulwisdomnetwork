# Spec 005 step 8, part 1: build the edit package for one episode (agent/src/podcast/package.ts,
# docs/specs/009-edit-package.md): the full episode, the "In this episode" clips (tag burned in), the b-roll
# images and a notes file, in "03 For Descript/<episode>" on Drive. Started from the show
# notes page, or by hand from the Actions tab with the episode ID.

name: Podcast Edit Package
# The episode ID in the run name ties each run to its episode on the Usage page (lib/server/usage.ts).
run-name: "Podcast Edit Package · ${{ inputs.episode_id }}"

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode ID (the Drive file ID in the Podcast Studio URL)'
        required: true

# One run per episode at a time; a second request for the same episode waits.
concurrency:
  group: podcast-package-${{ inputs.episode_id }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install ffmpeg
      run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

    - name: Build Edit Package
      env:
        EPISODE_ID: ${{ inputs.episode_id }}
        PODCAST_SA_JSON: ${{ secrets.PODCAST_SA_JSON }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        DRIVE_PROCESSED_FOLDER_ID: ${{ vars.DRIVE_PROCESSED_FOLDER_ID }}
        DRIVE_DESCRIPT_FOLDER_ID: ${{ vars.DRIVE_DESCRIPT_FOLDER_ID }}
        GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: npx tsx agent/src/podcast/package.ts
