# Spec 005 step 12: thumbnail options for one episode (agent/src/podcast/thumbnails.ts,
# docs/specs/011-thumbnails.md): texts from Claude, frames from the final cut and an AI background,
# which the Studio draws into three options for Checkpoint D. Started from the show notes page, or
# by hand from the Actions tab with the episode ID.

name: Podcast Thumbnails
# The episode ID in the run name ties each run to its episode on the Usage page (lib/server/usage.ts).
run-name: "Podcast Thumbnails · ${{ inputs.episode_id }}"

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Episode ID (the Drive file ID in the Podcast Studio URL)'
        required: true
      only:
        description: 'Set to "image" to make only a new AI background'
        required: false
        default: ''

# One run per episode at a time; a second request for the same episode waits.
concurrency:
  group: podcast-thumbnails-${{ inputs.episode_id }}
  cancel-in-progress: false

# The jobs use their own keys; the GitHub token only needs to read this repository.
permissions:
  contents: read

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install ffmpeg
      run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

    - name: Make Thumbnail Options
      env:
        EPISODE_ID: ${{ inputs.episode_id }}
        THUMB_ONLY: ${{ inputs.only }}
        PODCAST_SA_JSON: ${{ secrets.PODCAST_SA_JSON }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: npx tsx agent/src/podcast/thumbnails.ts
