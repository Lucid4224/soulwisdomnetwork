# Firebase App Hosting Configuration
# This file defines how your app is built and run.
# Data here is public, so we use 'secret:NAME' to reference sensitive keys securely.

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: FIREBASE_API_KEY
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: FIREBASE_AUTH_DOMAIN
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: FIREBASE_STORAGE_BUCKET
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: FIREBASE_MESSAGING_SENDER_ID
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: FIREBASE_APP_ID

  # App Check (bot protection) for the community feed: the reCAPTCHA Enterprise site key, which
  # is public. Register it in Firebase App Check FIRST, then uncomment this
  # (docs/specs/016-community-feed.md, "Bot protection").
  # - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
  #   value: <site key>

  # The Videos pages (docs/specs/017-videos.md): a YouTube Data API key, server-side only.
  # Needed at build time too, when the pages are first drawn. Create the secret BEFORE this
  # reaches main, or the App Hosting build fails (fah/misconfigured-secret).
  - variable: YOUTUBE_API_KEY
    secret: YOUTUBE_API_KEY

  # Podcast Studio (docs/specs/006-podcast-studio.md), server-side only.
  - variable: GITHUB_ACTIONS_TOKEN
    secret: GITHUB_ACTIONS_TOKEN
    availability:
      - RUNTIME
  - variable: DRIVE_BACKLOG_FOLDER_ID
    value: 1I_ptlY4leCFrA3a15wNO7ArXym1d76D1
    availability:
      - RUNTIME
  - variable: DRIVE_TO_PROCESS_FOLDER_ID
    value: 1AzhAVI3z7w2iGzj0Du_XeEDyysbL2wew
    availability:
      - RUNTIME
  - variable: DRIVE_PROCESSED_FOLDER_ID
    value: 1csV5XHU8oUJfBUQcVKihg8reqewme12F
